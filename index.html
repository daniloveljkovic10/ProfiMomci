<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    input {
      padding: 10px;
    }

    button {
      padding: 10px 15px;
      cursor: pointer;
    }

    #poruka {
      margin-top: 20px;
      font-size: 20px;
      color: black;
    }
  </style>
</head>

<body>

  <input type="text" id="unos" placeholder="Unesite ime">
  <button id="posalji" type="button">Pošalji</button>

  <p id="poruka"></p>

  <script>
    "use strict";

    const input = document.getElementById("unos");
    const dugme = document.getElementById("posalji");
    const paragraf = document.getElementById("poruka");

    dugme.addEventListener("click", () => {
      const tekst = input.value.trim();

      if (tekst.length === 0) {
        paragraf.textContent = "Unesite tekst.";
        return;
      }

      paragraf.textContent = "Zdravo " + tekst;

      input.value = "";
      input.focus();
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        dugme.click();
      }
    });
  </script>

</body>
</html>
