<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <title>Bezbedan unos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <input type="text" id="unos" placeholder="Unesite tekst">
  <button id="posalji">Pošalji</button>

  <p id="poruka"></p>

  <script>
    const input = document.getElementById("unos");
    const dugme = document.getElementById("posalji");
    const paragraf = document.getElementById("poruka");

    dugme.addEventListener("click", () => {
      paragraf.textContent = input.value;
    });
  </script>


 <script src="java.js"></script>
</body>
</html>
